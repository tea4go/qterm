[package]
name = "qterm"
version = "0.1.0"
edition = "2021"
description = "A lightweight cross-platform terminal emulator"
license = "MIT"

[dependencies]
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "wgpu"] }
egui = "0.29"
portable-pty = "0.9"
vte = "0.13"
uuid = { version = "1", features = ["v4"] }
russh = "0.46"
russh-keys = "0.46"
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "sync"] }

[profile.release]
opt-level = "z"
lto = true
strip = true
