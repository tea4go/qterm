[package]
name = "qterm"
version = "0.1.0"
edition = "2021"
description = "A lightweight cross-platform terminal emulator"
license = "MIT"

[dependencies]
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "wgpu"] }
egui = "0.29"
portable-pty = "0.9"
vte = "0.13"
uuid = { version = "1", features = ["v4"] }
russh = "0.46"
russh-keys = "0.46"
russh-sftp = "2.3"
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "sync"] }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
aes = "0.9"
cfb-mode = "0.9"
cipher = "0.5"
hex = "0.4"
global-hotkey = "0.6"

[profile.release]
opt-level = "z"
lto = true
strip = true
